backend:
  name: git-gateway
  branch: main

site_url: https://massdjelf.github.io/portfolio
display_url: https://massdjelf.github.io/portfolio

media_folder: "resources/uploads"
public_folder: "resources/uploads"

collections:
  - name: "certifications"
    label: "Certifications"
    label_singular: "Certification"
    files:
      - name: "certifications"
        label: "Certifications List"
        file: "certifications.json"
        format: "json"
        fields:
          - name: "items"
            label: "Certifications"
            widget: "list"
            label_singular: "Certification"
            summary: "{{fields.title}} — {{fields.issuer}} ({{fields.year}})"
            fields:
              - { name: "id", label: "ID", widget: "number", value_type: "int", required: false, hint: "Leave blank for new entries — auto-filled." }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "issuer", label: "Issuer", widget: "string" }
              - { name: "year", label: "Year", widget: "string" }
              - { name: "image", label: "Image", widget: "image", required: false }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    files:
      - name: "projects"
        label: "Projects List"
        file: "projects.json"
        format: "json"
        fields:
          - name: "items"
            label: "Projects"
            widget: "list"
            label_singular: "Project"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { name: "id", label: "ID", widget: "number", value_type: "int", required: false, hint: "Leave blank for new entries — auto-filled." }
              - { name: "title", label: "Title", widget: "string" }
              - name: "category"
                label: "Category"
                widget: "select"
                options: ["web", "mobile", "design", "data"]
              - { name: "description", label: "Description", widget: "text" }
              - name: "technologies"
                label: "Technologies"
                widget: "list"
                field: { name: "technology", label: "Technology", widget: "string" }
              - { name: "image", label: "Image", widget: "image", required: false }
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { name: "featured", label: "Featured", widget: "boolean", default: true }
